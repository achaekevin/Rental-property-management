version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: rpm_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rental_property_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rpm_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rpm_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MYSQL_HOST=rpm_mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DATABASE=rental_property_db
      - JWT_SECRET=rental_property_secret_jwt_key_2026
    depends_on:
      - mysql
    networks:
      - rpm_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: rpm_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rpm_network

volumes:
  mysql_data:

networks:
  rpm_network:
    driver: bridge
